<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>상권실적 관리자</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="config.js"></script>
    <style>
        :root { --blue: #2563eb; --blue-soft: #eff4ff; --line: #e5e7eb; --text: #1f2937; --muted: #6b7280; --red: #dc2626; --green: #0f9f8f; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: #f6f7f9; color: var(--text); font-size: 14px; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 14px; }
        header h1 { font-size: 19px; margin: 0; display: flex; align-items: center; gap: 8px; }
        header h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
        .banner { background: #fff8e6; border: 1px solid #f5dfa5; color: #8a6100; font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 14px; }
        .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
        .card h2 { font-size: 15px; margin: 0 0 12px; }
        label.field { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin: 10px 0 5px; }
        input[type=email], input[type=password], input[type=date], input[type=file] {
            width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff;
        }
        input:focus { outline: 2px solid #bfd3ff; border-color: var(--blue); }
        .btn { min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--blue); background: var(--blue); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-outline { background: #fff; color: var(--blue); }
        .btn-danger { background: #fff; color: var(--red); border-color: #f3c4c4; min-height: 36px; padding: 0 12px; font-size: 13px; }
        .btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
        .row { display: flex; gap: 8px; align-items: flex-end; }
        .row > * { flex: 1; }
        .actions { display: flex; gap: 8px; margin-top: 14px; }
        .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
        .msg.err { color: var(--red); }
        .msg.ok { color: var(--green); }
        .preview { margin-top: 12px; background: var(--blue-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; display: none; }
        .preview b { color: var(--blue); }
        .preview .warn { color: var(--red); font-weight: 600; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        th, td { padding: 9px 6px; text-align: left; border-bottom: 1px solid var(--line); }
        th { color: var(--muted); font-weight: 600; font-size: 12px; }
        td.date { font-weight: 700; white-space: nowrap; }
        td.name { color: var(--muted); word-break: break-all; font-size: 12px; }
        td.act { text-align: right; white-space: nowrap; }
        .badge { display: inline-block; background: var(--blue); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; vertical-align: middle; }
        .empty { color: var(--muted); text-align: center; padding: 18px 0; }
        .site-link { text-decoration: none; display: inline-flex; align-items: center; }
        .hidden { display: none !important; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #c7d2fe; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
        @media (max-width: 640px) {
            .wrap { padding: 12px; }
            .row { flex-direction: column; align-items: stretch; }
            td.name { display: none; }
            th.name { display: none; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1><span class="dot"></span>상권실적 데이터 관리</h1>
        <div style="display:flex; gap:6px;">
            <a class="btn btn-outline btn-sm site-link" href="index.html" target="_blank">지도 보기 ↗</a>
            <button class="btn btn-outline btn-sm hidden" id="logoutBtn">로그아웃</button>
        </div>
    </header>
    <div class="banner">내부 업무용 관리자 페이지입니다. 업로드한 파일은 지도 사이트에서 기준일자별로 조회됩니다.</div>

    <!-- 로그인 -->
    <div class="card" id="loginCard">
        <h2>관리자 로그인</h2>
        <form id="loginForm">
            <label class="field" for="email">이메일</label>
            <input type="email" id="email" autocomplete="username" required>
            <label class="field" for="password">비밀번호</label>
            <input type="password" id="password" autocomplete="current-password" required>
            <div class="actions"><button class="btn" type="submit" id="loginBtn">로그인</button></div>
            <div class="msg" id="loginMsg"></div>
        </form>
    </div>

    <!-- 업로드 -->
    <div class="card hidden" id="uploadCard">
        <h2>실적 파일 업로드</h2>
        <label class="field" for="csvFile">CSV 파일 (최종_주소지별실적 양식)</label>
        <input type="file" id="csvFile" accept=".csv,text/csv">
        <label class="field" for="baseDate">기준일자 <span style="font-weight:400">(파일명에 8자리 날짜가 있으면 자동 입력)</span></label>
        <input type="date" id="baseDate">
        <div class="preview" id="preview"></div>
        <div class="actions"><button class="btn" id="uploadBtn" disabled>업로드</button></div>
        <div class="msg" id="uploadMsg"></div>
    </div>

    <!-- 목록 -->
    <div class="card hidden" id="listCard">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <h2 style="margin:0;">업로드된 기준일자</h2>
            <button class="btn btn-outline btn-sm" id="refreshBtn">새로고침</button>
        </div>
        <table>
            <thead><tr><th>기준일자</th><th class="name">파일명</th><th>업로드</th><th></th></tr></thead>
            <tbody id="fileList"><tr><td colspan="4" class="empty">불러오는 중...</td></tr></tbody>
        </table>
    </div>
</div>

<script>
    var CFG = window.APP_CONFIG || {};
    var REQUIRED_COLS = ['지역합', 'POS코드', '판매점명', '주소', '총실적', '거래점1', '실적1', '거래점2', '실적2', '위도', '경도'];
    var FALLBACK_KEY = 'aw_cookie_fallback_' + CFG.APPWRITE_PROJECT;

    var parsedFile = null;   // { file, rows, date }
    var existingDates = {};  // { '20261109': fileId }

    function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function $(id) { return document.getElementById(id); }
    function fmtDate(d) { return d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8); }
    function setMsg(id, text, type) { var el = $(id); el.className = 'msg ' + (type || ''); el.innerHTML = text; }

    // ===== Appwrite REST 클라이언트 =====
    // 사이트와 Appwrite 도메인이 달라 쿠키가 막히는 브라우저(사파리 등)를 위해 X-Fallback-Cookies도 함께 사용
    async function aw(method, path, body, isForm) {
        var headers = { 'X-Appwrite-Project': CFG.APPWRITE_PROJECT };
        var fb = null;
        try { fb = localStorage.getItem(FALLBACK_KEY); } catch (e) {}
        if (fb) headers['X-Fallback-Cookies'] = fb;
        if (body && !isForm) headers['Content-Type'] = 'application/json';

        var res = await fetch(CFG.APPWRITE_ENDPOINT + path, {
            method: method, headers: headers, credentials: 'include',
            body: body ? (isForm ? body : JSON.stringify(body)) : undefined
        });
        var newFb = res.headers.get('X-Fallback-Cookies');
        if (newFb) { try { localStorage.setItem(FALLBACK_KEY, newFb); } catch (e) {} }

        var data = null;
        var ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) data = await res.json();
        if (!res.ok) {
            var err = new Error((data && data.message) || ('요청 실패 (' + res.status + ')'));
            err.status = res.status; err.type = data && data.type;
            throw err;
        }
        return data;
    }

    // ===== 로그인/로그아웃 =====
    async function checkSession() {
        try { await aw('GET', '/account'); showAdmin(true); }
        catch (e) { showAdmin(false); }
    }

    function showAdmin(on) {
        $('loginCard').classList.toggle('hidden', on);
        $('uploadCard').classList.toggle('hidden', !on);
        $('listCard').classList.toggle('hidden', !on);
        $('logoutBtn').classList.toggle('hidden', !on);
        if (on) loadList();
    }

    $('loginForm').addEventListener('submit', async function(ev) {
        ev.preventDefault();
        $('loginBtn').disabled = true;
        setMsg('loginMsg', '<span class="spinner"></span>로그인 중...');
        try {
            await aw('POST', '/account/sessions/email', { email: $('email').value.trim(), password: $('password').value });
            $('password').value = '';
            setMsg('loginMsg', '');
            showAdmin(true);
        } catch (e) {
            if (e.type === 'user_session_already_exists') { showAdmin(true); return; }
            setMsg('loginMsg', '로그인 실패: 이메일/비밀번호를 확인해 주세요.', 'err');
        } finally {
            $('loginBtn').disabled = false;
        }
    });

    $('logoutBtn').addEventListener('click', async function() {
        try { await aw('DELETE', '/account/sessions/current'); } catch (e) {}
        try { localStorage.removeItem(FALLBACK_KEY); } catch (e) {}
        showAdmin(false);
    });

    // ===== 파일 선택 → 검증/미리보기 =====
    function dateFromName(name) {
        var m = name.match(/(20\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])/);
        return m ? m[0] : null;
    }

    $('csvFile').addEventListener('change', function() {
        parsedFile = null;
        $('uploadBtn').disabled = true;
        $('preview').style.display = 'none';
        setMsg('uploadMsg', '');
        var file = this.files[0];
        if (!file) return;

        var d = dateFromName(file.name);
        if (d) $('baseDate').value = fmtDate(d);

        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            transformHeader: h => h.replace(/^﻿/, '').trim(),
            transform: v => typeof v === 'string' ? v.trim() : v,
            complete: function(res) {
                var cols = res.meta.fields || [];
                var missing = REQUIRED_COLS.filter(c => !cols.includes(c));
                if (missing.length) {
                    setMsg('uploadMsg', '양식이 다릅니다. 없는 열: <b>' + esc(missing.join(', ')) + '</b>', 'err');
                    return;
                }
                var rows = res.data;
                var total = rows.reduce((s, r) => s + (parseInt(r.총실적) || 0), 0);
                var noCoord = rows.filter(r => !r.위도 || !r.경도).length;
                var regions = new Set(rows.map(r => r.지역합)).size;
                $('preview').innerHTML =
                    `판매점 <b>${rows.length.toLocaleString()}</b>개 · 총실적 <b>${total.toLocaleString()}</b>건 · 지역 <b>${regions}</b>개` +
                    (noCoord ? `<br><span class="warn">위도/경도가 없는 ${noCoord}개 행은 지도에 표시되지 않습니다.</span>` : '');
                $('preview').style.display = 'block';
                parsedFile = { file: file, rows: rows };
                $('uploadBtn').disabled = false;
            },
            error: function() { setMsg('uploadMsg', 'CSV를 읽지 못했습니다.', 'err'); }
        });
    });

    // ===== 업로드 (파일ID = 기준일자 8자리, 같은 날짜는 덮어쓰기) =====
    $('uploadBtn').addEventListener('click', async function() {
        if (!parsedFile) return;
        var dateVal = $('baseDate').value;   // YYYY-MM-DD
        if (!dateVal) { setMsg('uploadMsg', '기준일자를 선택해 주세요.', 'err'); return; }
        var date = dateVal.replace(/-/g, '');

        if (existingDates[date] && !confirm(fmtDate(date) + ' 데이터가 이미 있습니다. 새 파일로 덮어쓸까요?')) return;

        $('uploadBtn').disabled = true;
        setMsg('uploadMsg', '<span class="spinner"></span>업로드 중...');
        try {
            if (existingDates[date]) await aw('DELETE', '/storage/buckets/' + CFG.BUCKET_ID + '/files/' + existingDates[date]);

            var named = new File([parsedFile.file], '주소지별실적_' + date + '.csv', { type: 'text/csv' });
            var form = new FormData();
            form.append('fileId', date);
            form.append('file', named);
            await aw('POST', '/storage/buckets/' + CFG.BUCKET_ID + '/files', form, true);

            setMsg('uploadMsg', fmtDate(date) + ' 업로드 완료', 'ok');
            $('csvFile').value = ''; $('baseDate').value = '';
            $('preview').style.display = 'none';
            parsedFile = null;
            loadList();
        } catch (e) {
            var hint = e.status === 401 ? ' (로그인이 만료되었거나 업로드 권한이 없습니다)' : '';
            setMsg('uploadMsg', '업로드 실패: ' + esc(e.message) + hint, 'err');
            $('uploadBtn').disabled = false;
        }
    });

    // ===== 목록 / 삭제 =====
    async function loadList() {
        var tbody = $('fileList');
        tbody.innerHTML = '<tr><td colspan="4" class="empty"><span class="spinner"></span>불러오는 중...</td></tr>';
        try {
            var all = [], offset = 0, LIMIT = 100;
            while (true) {
                var q = '?queries[]=' + encodeURIComponent(JSON.stringify({ method: 'limit', values: [LIMIT] })) +
                        '&queries[]=' + encodeURIComponent(JSON.stringify({ method: 'offset', values: [offset] }));
                var res = await aw('GET', '/storage/buckets/' + CFG.BUCKET_ID + '/files' + q);
                all = all.concat(res.files || []);
                if (!res.files || res.files.length < LIMIT) break;
                offset += LIMIT;
            }
            existingDates = {};
            var items = all.map(f => ({ f: f, date: dateFromName(f.$id + ' ' + f.name) }))
                           .filter(x => x.date)
                           .sort((a, b) => b.date.localeCompare(a.date));
            items.forEach(x => { existingDates[x.date] = x.f.$id; });

            if (!items.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty">업로드된 파일이 없습니다.</td></tr>'; return; }
            tbody.innerHTML = items.map((x, i) => {
                var up = new Date(x.f.$createdAt);
                var upText = (up.getMonth() + 1) + '/' + up.getDate() + ' ' + String(up.getHours()).padStart(2, '0') + ':' + String(up.getMinutes()).padStart(2, '0');
                return `<tr>
                    <td class="date">${fmtDate(x.date)}${i === 0 ? '<span class="badge">최신</span>' : ''}</td>
                    <td class="name">${esc(x.f.name)}</td>
                    <td>${upText}</td>
                    <td class="act"><button class="btn btn-danger" data-id="${esc(x.f.$id)}" data-date="${x.date}">삭제</button></td>
                </tr>`;
            }).join('');
        } catch (e) {
            var hint = e.status === 404 ? ' (버킷 ID를 확인해 주세요)' : '';
            tbody.innerHTML = '<tr><td colspan="4" class="empty" style="color:var(--red)">목록을 불러오지 못했습니다: ' + esc(e.message) + hint + '</td></tr>';
        }
    }

    $('fileList').addEventListener('click', async function(ev) {
        var btn = ev.target.closest('button[data-id]');
        if (!btn) return;
        if (!confirm(fmtDate(btn.dataset.date) + ' 데이터를 삭제할까요? 되돌릴 수 없습니다.')) return;
        btn.disabled = true;
        try {
            await aw('DELETE', '/storage/buckets/' + CFG.BUCKET_ID + '/files/' + btn.dataset.id);
            loadList();
        } catch (e) {
            alert('삭제 실패: ' + e.message);
            btn.disabled = false;
        }
    });

    $('refreshBtn').addEventListener('click', loadList);

    checkSession();
</script>
</body>
</html>
